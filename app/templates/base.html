<!DOCTYPE html>
<html>
  <head>
    <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/darkly/bootstrap.min.css"
    rel="stylesheet">
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{{ url_for('pages.home') }}">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('pages.ble_presence') }}">Presence</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('pages.about') }}">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('pages.form') }}">Form</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>

    </div>
      {% if USE_SOCKETIO %}
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
      {% endif %}
      <script src="{{ url_for('static', filename='app.js') }}"></script>
    </div>
  </body>
</html>
