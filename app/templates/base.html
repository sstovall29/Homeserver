<!DOCTYPE html>
<html>
  <head>
    <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/cyborg/bootstrap.min.css"
    rel="stylesheet">
  </head>
  <body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">

        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center" href="{{ url_for('pages.home') }}">
          <!-- <img
            class="light-img"
            src="{{ url_for('static', filename='images/light_on.png') }}"
            alt="210 Robotics Logo"
            style="height: 40px; width: auto; margin-right: 10px;"
          > -->
          210 Robotics
        </a>

        <!-- Mobile menu button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">

            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'pages.home' %}active{% endif %}"
                href="{{ url_for('pages.home') }}"
                {% if request.endpoint == 'pages.home' %}aria-current="page"{% endif %}
              >
                Home
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'pages.projects' %}active{% endif %}"
                href="{{ url_for('pages.projects') }}"
                {% if request.endpoint == 'pages.projects' %}aria-current="page"{% endif %}
              >
                Projects
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'pages.ble_presence' %}active{% endif %}"
                href="{{ url_for('pages.ble_presence') }}"
                {% if request.endpoint == 'pages.ble_presence' %}aria-current="page"{% endif %}
              >
                Presence
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'pages.homebot' %}active{% endif %}"
                href="{{ url_for('pages.homebot') }}"
                {% if request.endpoint == 'pages.homebot' %}aria-current="page"{% endif %}
              >
                Homebot
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'pages.about' %}active{% endif %}"
                href="{{ url_for('pages.about') }}"
                {% if request.endpoint == 'pages.about' %}aria-current="page"{% endif %}
              >
                About
              </a>
            </li>

          </ul>
        </div>

      </div>
    </nav>
  </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <div class="container">
      <footer class="py-3 my-4">

        <ul class="nav justify-content-center border-bottom pb-3 mb-3">

          <li class="nav-item">
            <a href="{{ url_for('pages.home') }}" class="nav-link px-2 text-body-secondary">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a href="{{ url_for('pages.projects') }}" class="nav-link px-2 text-body-secondary">
              Projects
            </a>
          </li>

          <li class="nav-item">
            <a href="{{ url_for('pages.ble_presence') }}" class="nav-link px-2 text-body-secondary">
              Presence
            </a>
          </li>

          <li class="nav-item">
            <a href="{{ url_for('pages.homebot') }}" class="nav-link px-2 text-body-secondary">
              Homebot
            </a>
          </li>

          <li class="nav-item">
            <a href="{{ url_for('pages.about') }}" class="nav-link px-2 text-body-secondary">
              About
            </a>
          </li>

        </ul>

        <p class="text-center text-body-secondary">
          © 2026 210 Robotics. All rights reserved.
        </p>

      </footer>
    </div>

    </div>
      {% if USE_SOCKETIO %}
        <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
      {% endif %}
      <script src="{{ url_for('static', filename='app.js') }}"></script>
    </div>
  </body>
</html>
